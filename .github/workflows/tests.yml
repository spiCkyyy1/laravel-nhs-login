name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        dependency-version: [prefer-lowest, prefer-stable]
        exclude:
          - php: '8.2'
            laravel: '13.*'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.dependency-version }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, openssl
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/pest

  static-analysis:
    runs-on: ubuntu-latest
    name: Static analysis

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, openssl
          coverage: none

      - run: composer install --prefer-dist --no-interaction

      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
      - run: vendor/bin/phpstan analyse -c phpstan.tests.neon --no-progress --memory-limit=512M

      - run: vendor/bin/pint --test

  coverage:
    runs-on: ubuntu-latest
    name: Coverage

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, openssl
          coverage: pcov

      - run: composer install --prefer-dist --no-interaction

      # No --min gate yet: run `composer test:coverage` locally, decide a
      # floor once you have looked at the actual number, then add it here.
      # A threshold guessed from a CI log nobody read is how a release ends
      # up blocked for a reason nobody remembers.
      - run: vendor/bin/pest --coverage --coverage-clover=coverage.xml

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
